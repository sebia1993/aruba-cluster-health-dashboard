[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aruba-mini-dashboard"
version = "0.6.1"
description = "Offline Windows dashboard for Aruba MM and 7240XM cluster health."
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
dependencies = [
  "netmiko==4.6.0",
  "paramiko==5.0.0",
  "PySide6-Essentials==6.11.0",
  "pywin32==311; sys_platform == 'win32'",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
]
[project.optional-dependencies]
dev = [
  "pyinstaller==6.21.0",
  "pytest==9.1.1",
]

[project.scripts]
aruba-mini-dashboard = "aruba_mini_dashboard.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aruba_mini_dashboard = ["ui/resources/*.svg"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "windows: requires Windows APIs",
  "integration: local integration test",
  "gui: Qt GUI test",
  "reliability: deterministic fault-injection and repeated lifecycle test",
]
