name: 버그 보고
description: 민감정보를 제거한 Aruba Mini Dashboard 문제를 보고합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        실제 IP, Hostname, 사용자 ID, 비밀번호, SSH 호스트 키, 원본 명령 출력,
        DB 또는 로그 원문을 공개 Issue에 첨부하지 마십시오. 보안 문제는
        저장소의 Security 탭에 비공개 제보 기능이 있으면 그 경로를 사용하십시오.
  - type: input
    id: version
    attributes:
      label: 버전
      description: 예: v0.1.1 Prerelease
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 환경
      description: Windows edition, build, 화면 배율과 일반/관리자 권한 여부
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: 재현 환경
      options:
        - 비식별 fixture 또는 Demo
        - 로컬 가짜 SSH
        - 승인된 실제 Aruba 장비
        - 기타 비식별 환경
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 기대 동작과 실제 동작
      description: 장비 식별정보를 제거하고 화면 문구와 동작 차이를 설명하십시오.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 최소 재현 절차
      description: 원본 출력 대신 비식별 fixture 또는 안정적인 오류 코드를 사용하십시오.
    validations:
      required: true
  - type: input
    id: error_code
    attributes:
      label: 오류 코드 또는 파싱 상태
      description: 예: AUTH_FAILED, COMMAND_TIMEOUT, PARSE_FAILED
  - type: checkboxes
    id: privacy
    attributes:
      label: 민감정보 확인
      options:
        - label: 본문과 첨부물에서 자격 증명, 실제 IP/Hostname, 키, DB, 로그 및 원본 출력을 제거했습니다.
          required: true
