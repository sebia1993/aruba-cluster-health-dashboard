name: Validate Windows package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aruba-mini-dashboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Test and verify Windows onedir
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Create repository virtual environment
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3, 11, 9), sys.version"
          python -m venv .venv
          .\.venv\Scripts\python.exe -c "import sys; assert sys.version_info[:3] == (3, 11, 9), sys.version"

      - name: Test, build, archive, and verify extracted EXE
        shell: pwsh
        run: |
          $version = .\.venv\Scripts\python.exe -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not resolve the source version.'
          }
          .\scripts\package_release.ps1 -Version $version.Trim()
