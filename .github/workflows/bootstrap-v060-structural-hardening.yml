name: "Bootstrap v0.6.0 structural hardening"

on:
  push:
    branches:
      - agent/v0.6.0-structural-hardening

permissions:
  contents: write

concurrency:
  group: aruba-mini-dashboard-v060-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize reviewed v0.6.0 source bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/v0.6.0-structural-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and extract source bundle
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          parts = sorted(Path('.github').glob('v060-source.tar.gz.b64.seg*'))
          if not parts:
              print('source bundle already materialized')
              Path('.github/v060-bootstrap-skipped').write_text('1\n', encoding='utf-8')
              raise SystemExit(0)
          if len(parts) != 8:
              raise SystemExit(f'expected 8 source segments, found {len(parts)}')
          encoded = ''.join(part.read_text(encoding='ascii') for part in parts)
          raw = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = 'af4b24939d0ec499fbe36795e2e6355b199937d4c5ab4da4b98a99045a3e8631'
          if digest != expected:
              raise SystemExit(f'source bundle SHA-256 mismatch: {digest}')
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              members = archive.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f'unsupported archive member: {member.name}')
              archive.extractall('.', members=members, filter='data')
          for part in parts:
              part.unlink()
          print(f'materialized source bundle {digest}')
          PY

      - name: Apply v0.6.0 repository changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/v060-bootstrap-skipped ]]; then
            rm -f .github/v060-bootstrap-skipped
            exit 0
          fi
          # The packaged README does not contain the developer-only packaging
          # command on all historical branches. Keep the version header update
          # required, but remove that optional patch line before applying.
          python - <<'PY'
          from pathlib import Path
          path = Path('apply_v060.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          lines = [
              line for line in lines
              if not (
                  "replace_required('docs/README.txt'" in line
                  and 'package_release.ps1' in line
              )
          ]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python apply_v060.py
          python -m compileall -q src tests scripts

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit.'
            exit 0
          fi
          git commit -m "feat: harden remediation architecture for v0.6.0"
          git push origin HEAD:agent/v0.6.0-structural-hardening
