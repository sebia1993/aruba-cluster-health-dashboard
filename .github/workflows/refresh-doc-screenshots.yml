name: Refresh documentation screenshots

on:
  push:
    branches:
      - agent/portfolio-polish
    paths:
      - .github/workflows/refresh-doc-screenshots.yml

permissions:
  contents: write

jobs:
  render-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up exact build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked project environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r .\requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed.' }
          .\.venv\Scripts\python.exe -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw 'Editable project installation failed.' }

      - name: Render verified Korean UI screenshots
        shell: pwsh
        run: |
          $fontBlobSha = 'b386890ba945e1f39448a6b59f20c5d194f58808'
          $fontApi = "https://api.github.com/repos/google/fonts/git/blobs/$fontBlobSha"
          $headers = @{
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'ArubaMiniDashboard-Docs-CI'
          }
          $fontBlob = Invoke-RestMethod -Uri $fontApi -Headers $headers
          if ($fontBlob.sha -ne $fontBlobSha -or $fontBlob.encoding -ne 'base64') {
            throw 'Pinned Noto Sans KR blob verification failed.'
          }
          $fontPath = Join-Path $env:RUNNER_TEMP 'NotoSansKR.ttf'
          $fontBytes = [Convert]::FromBase64String(($fontBlob.content -replace '\s', ''))
          [IO.File]::WriteAllBytes($fontPath, $fontBytes)
          if ((Get-Item -LiteralPath $fontPath).Length -ne 10414588) {
            throw 'Pinned Noto Sans KR font size verification failed.'
          }
          $env:DOCS_FONT_PATH = $fontPath
          .\.venv\Scripts\python.exe .\scripts\render_docs_screenshots.py --output .\docs\images
          if ($LASTEXITCODE -ne 0) { throw 'Documentation screenshot rendering failed.' }

      - name: Commit exact rendered PNGs
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/images/dashboard-normal.png docs/images/dashboard-incident.png
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Documentation screenshots already match rendered output.'
            exit 0
          }
          git commit -m 'docs: add verified dashboard screenshots'
          if ($LASTEXITCODE -ne 0) { throw 'Screenshot commit failed.' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Screenshot push failed.' }
