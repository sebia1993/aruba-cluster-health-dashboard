name: "Bootstrap automatic remediation v0.5.0 branch"

on:
  push:
    branches: [feat/automatic-controller-remediation]

permissions:
  contents: write

concurrency:
  group: bootstrap-automatic-remediation-v0.5.0
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize reviewed source bundle and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/automatic-controller-remediation
          fetch-depth: 0
          persist-credentials: true

      - name: Extract source and update versioned documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64, io, tarfile
          from pathlib import Path, PurePosixPath

          parts = sorted(Path('.github').glob('remediation-v0.5.0.tar.gz.b64.part*'))
          if len(parts) != 6:
              raise SystemExit(f'expected 6 bundle parts, found {len(parts)}')
          raw = base64.b64decode(''.join(p.read_text(encoding='ascii') for p in parts), validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              members = archive.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe bundle member: {member.name}')
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f'unsupported bundle member: {member.name}')
              archive.extractall('.', members=members, filter='data')

          # Workflow files are written separately by the connected GitHub app.
          Path('.github/workflows/auto-release-on-version.yml').unlink(missing_ok=True)

          version, old = '0.5.0', '0.4.2'
          def replace(path: str, before: str, after: str, *, required: bool = True) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if after in text:
                  return
              if before not in text:
                  if required:
                      raise SystemExit(f'missing version text in {path}: {before!r}')
                  return
              file.write_text(text.replace(before, after), encoding='utf-8')

          replace('README.md', f'.\\scripts\\package_release.ps1 -Version {old}', f'.\\scripts\\package_release.ps1 -Version {version}')
          replace('docs/RELEASE_PROCESS_KO.md', old, version)
          replace('docs/README.txt', f'Aruba Mini Dashboard {old}\n', f'Aruba Mini Dashboard {version}\n')
          replace('docs/README.txt', f'.\\scripts\\package_release.ps1 -Version {old}', f'.\\scripts\\package_release.ps1 -Version {version}', required=False)

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text(encoding='utf-8')
          heading = f'## {version} - 2026-08-25'
          if heading not in current:
              section = f'''# 변경 이력\n\n{heading}\n\n### 자동 Controller 장애조치\n\n- 기존 읽기 전용 자동점검과 독립적인 기본 OFF 자동 장애조치 토글을 추가했습니다.\n- 신뢰 가능한 MM 단일 Down 재검증, 대상 SSH 최대 3회, `reload force` 1회,\n  MM Up 대기, 현재 Leader 재탐색, 대상 `CONNECTED` 확인과 Leader 재분배를 구현했습니다.\n- `Cluster rebalance triggered` 독립 행과 전체 MM·Membership·Client Distribution을\n  사후 연속 확인합니다.\n\n### 안전·감사·보고\n\n- 기존 조회 allowlist를 변경하지 않고 두 변경 명령을 별도 SSH 경계로 분리했습니다.\n- 실행 예약과 대상 잠금을 별도 SQLite에 먼저 저장해 중복 재부팅·재분배를 막습니다.\n- 모든 종료 상태에 대해 타임라인과 전후 상태를 포함한 단일 HTML 보고서를 생성합니다.\n- 실제 Aruba 장비의 변경 명령은 승인된 현장 환경에서 별도 검증해야 합니다.\n\n'''
              if not current.startswith('# 변경 이력\n\n'):
                  raise SystemExit('unexpected changelog header')
              changelog.write_text(section + current[len('# 변경 이력\n\n'):], encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '**Aruba Mobility Master(MM)와 7240XM 클러스터의 여러 상태 정보를 읽기 전용 SSH로 수집하고, 장비 IP 기준으로 상관분석해 `정상 / 주의 / 장애 / 확인 불가`를 판단하는 Windows 네트워크 모니터링 도구입니다.**',
              '**Aruba Mobility Master(MM)와 7240XM 클러스터 상태를 읽기 전용 SSH로 수집·상관분석하고, 필요할 때만 별도로 켜는 자동 Controller 장애조치를 제공하는 Windows 네트워크 운영 도구입니다.**',
          )
          text = text.replace('| 운영 변경 | **없음 — 설정 모드와 구성 변경 명령을 사용하지 않음** |', '| 운영 변경 | 기본 OFF 자동 장애조치에서 검토된 재부팅·재분배 명령만 별도 실행 |')
          text = text.replace('- 구성 변경 명령을 허용하지 않습니다.', '- 기본 점검에서는 구성 변경 명령을 허용하지 않습니다. 자동 장애조치는 별도 ON/OFF·allowlist·감사 저장소를 사용합니다.')
          text = text.replace('- WLC 설정 변경 또는 자동 복구 명령 실행', '- 자동 장애조치 두 명령 이외의 WLC 설정 변경 또는 임의 복구 명령')
          if '## 자동 Controller 장애조치\n' not in text:
              block = '''\n## 자동 Controller 장애조치\n\n`v0.5.0`부터 기존 읽기 전용 점검과 별도로 켜고 끌 수 있는 기본 OFF 자동 장애조치를 제공합니다. 등록 Controller 한 대의 명시적 Down을 확인하면 대상 SSH 최대 3회, `reload force`, MM Up 대기, 현재 Leader 재탐색, 대상 `CONNECTED` 확인, `cluster-debug bucketmap rebalance`, 사후 점검을 순서대로 수행합니다. 모든 결과는 별도 SQLite 타임라인과 상급보고용 단일 HTML로 기록합니다. 상세 내용은 [자동 Controller 장애조치](docs/AUTOMATIC_REMEDIATION_KO.md)를 참고하십시오.\n\n'''
              text = text.replace('## 개발 및 패키지 검증\n', block + '## 개발 및 패키지 검증\n', 1)
          readme.write_text(text, encoding='utf-8')

          security = Path('docs/SECURITY_KO.md')
          text = security.read_text(encoding='utf-8')
          if '## 선택적 자동 장애조치 경계' not in text:
              block = '''## 선택적 자동 장애조치 경계\n\n자동 장애조치는 기본 OFF이며 기존 조회 allowlist와 분리된 `reload force`, `cluster-debug bucketmap rebalance`만 허용합니다. 동일 장애의 각 명령은 한 번으로 제한하고 실행 전 예약과 대상 잠금을 별도 SQLite에 저장합니다. 인증·호스트 키·다중 Down·Leader 불일치·부분 수집은 Fail-closed로 중단하며 보고서에는 자격 증명과 전체 SSH 원문을 저장하지 않습니다.\n\n'''
              text = text.replace('## 로컬 저장소\n', block + '## 로컬 저장소\n', 1)
          security.write_text(text, encoding='utf-8')

          for part in parts:
              part.unlink()
          PY

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add automatic controller remediation and reports"
          git push origin HEAD:feat/automatic-controller-remediation
