name: "Bootstrap v0.6.1 Connection-Type baseline acceptance"

on:
  push:
    branches:
      - agent/v0.6.1-connection-baseline-acceptance
    paths:
      - scripts/apply_v061_connection_baseline.py

permissions:
  contents: write

concurrency:
  group: aruba-mini-dashboard-v061-baseline-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed Connection-Type baseline patch
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/v0.6.1-connection-baseline-acceptance
          fetch-depth: 0
          persist-credentials: true

      - name: Apply patch and compile
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/apply_v061_connection_baseline.py ]]; then
            echo "Patch already materialized."
            exit 0
          fi
          python scripts/apply_v061_connection_baseline.py
          python -m compileall -q src tests scripts

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: accept reviewed Connection-Type as the new baseline"
          git push origin HEAD:agent/v0.6.1-connection-baseline-acceptance
