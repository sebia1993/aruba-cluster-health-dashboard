name: "Build and publish Windows prerelease"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated release tag, for example v0.3.4"
        required: true
        type: string
      release_mode:
        description: "Build only, create a review draft, or publish a prerelease"
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - draft-prerelease
          - publish-prerelease
      confirmation:
        description: "For draft or publish mode, enter the exact tag again"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aruba-mini-dashboard-release
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify versioned onedir package
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      tag-object: ${{ steps.metadata.outputs.tag_object }}
      source-commit: ${{ steps.metadata.outputs.source_commit }}
      release-mode: ${{ steps.metadata.outputs.release_mode }}
      artifact-name: ${{ steps.metadata.outputs.artifact_name }}
      zip-name: ${{ steps.assets.outputs.zip_name }}
      checksum-name: ${{ steps.assets.outputs.checksum_name }}
      sha256: ${{ steps.assets.outputs.sha256 }}

    steps:
      - name: Require a manual run from main
        shell: pwsh
        env:
          AMD_EVENT_NAME: ${{ github.event_name }}
          AMD_REF: ${{ github.ref }}
        run: |
          if ($env:AMD_EVENT_NAME -ne 'workflow_dispatch') {
            throw 'This release workflow accepts manual workflow_dispatch runs only.'
          }
          if ($env:AMD_REF -ne 'refs/heads/main') {
            throw "Release packaging must be dispatched from main. Current ref: $($env:AMD_REF)"
          }

      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify MIT distribution approval in source
        shell: pwsh
        env:
          AMD_PUBLIC_BINARY_DISTRIBUTION_APPROVED: "true"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AMD_PUBLIC_BINARY_DISTRIBUTION_APPROVED -cne 'true') {
            throw 'Public binary distribution must be explicitly approved in the reviewed workflow source.'
          }
          git ls-files --error-unmatch LICENSE *> $null
          if ($LASTEXITCODE -ne 0) {
            throw 'The reviewed release source must contain a tracked LICENSE file.'
          }
          $license = Get-Content -LiteralPath .\LICENSE -Raw -Encoding UTF8
          $requiredMitPhrases = @(
            'MIT License',
            'Permission is hereby granted, free of charge',
            'THE SOFTWARE IS PROVIDED "AS IS"'
          )
          foreach ($phrase in $requiredMitPhrases) {
            if (-not $license.Contains($phrase)) {
              throw "The tracked LICENSE file does not contain the expected MIT license text: $phrase"
            }
          }

      - name: Validate tag, source version, and release intent
        id: metadata
        shell: pwsh
        env:
          AMD_INPUT_TAG: ${{ inputs.tag }}
          AMD_RELEASE_MODE: ${{ inputs.release_mode }}
          AMD_CONFIRMATION: ${{ inputs.confirmation }}
          AMD_SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:AMD_INPUT_TAG.Trim()
          if ($tag -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$') {
            throw "Invalid release tag: $tag"
          }
          $version = $Matches.version
          $allowedModes = @('build-only', 'draft-prerelease', 'publish-prerelease')
          if ($allowedModes -notcontains $env:AMD_RELEASE_MODE) {
            throw "Invalid release mode: $($env:AMD_RELEASE_MODE)"
          }
          if ($env:AMD_RELEASE_MODE -ne 'build-only' -and $env:AMD_CONFIRMATION -cne $tag) {
            throw 'Draft and publish modes require confirmation that exactly matches the release tag.'
          }

          $pyproject = Get-Content -LiteralPath .\pyproject.toml -Raw -Encoding UTF8
          $packageInit = Get-Content -LiteralPath .\src\aruba_mini_dashboard\__init__.py -Raw -Encoding UTF8
          $pyprojectMatches = [regex]::Matches($pyproject, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          $packageMatches = [regex]::Matches($packageInit, '(?m)^__version__\s*=\s*"([^"]+)"\s*$')
          if ($pyprojectMatches.Count -ne 1 -or $packageMatches.Count -ne 1) {
            throw 'Source version declarations could not be resolved unambiguously.'
          }
          $pyprojectVersion = $pyprojectMatches[0].Groups[1].Value
          $packageVersion = $packageMatches[0].Groups[1].Value
          if ($pyprojectVersion -ne $version -or $packageVersion -ne $version) {
            throw "Tag version $version must match pyproject.toml ($pyprojectVersion) and package ($packageVersion)."
          }

          git fetch --force --no-tags origin "+refs/tags/$tag`:refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "The release tag must already exist on origin: $tag" }
          $tagType = (git cat-file -t "refs/tags/$tag").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagType -ne 'tag') {
            throw "Release tag must be an annotated tag: $tag"
          }
          $tagObject = (git rev-parse "refs/tags/$tag").Trim()
          $tagCommit = (git rev-parse "refs/tags/$tag^{}").Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($headCommit -ne $env:AMD_SOURCE_SHA -or $tagCommit -ne $headCommit) {
            throw "Tag $tag, checked-out source, and workflow source SHA must identify the same commit."
          }
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not refresh origin/main.' }
          $mainCommit = (git rev-parse origin/main).Trim()
          if ($tagCommit -ne $mainCommit) {
            throw "Release tag, workflow source SHA, and current origin/main must identify the same commit. Tag: $tagCommit; main: $mainCommit"
          }
          if (git status --porcelain) { throw 'The checked-out release source is unexpectedly dirty.' }

          @(
            "version=$version"
            "tag=$tag"
            "tag_object=$tagObject"
            "source_commit=$headCommit"
            "release_mode=$($env:AMD_RELEASE_MODE)"
            "artifact_name=aruba-mini-dashboard-release-$version-$headCommit"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Refuse an existing release or draft before building
        if: steps.metadata.outputs.release_mode != 'build-only'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AMD_RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          AMD_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AMD_REPOSITORY -notmatch '^(?<owner>[^/]+)/(?<name>[^/]+)$') {
            throw 'GitHub repository identity is invalid.'
          }
          $query = @'
          query($owner: String!, $name: String!, $tag: String!) {
            repository(owner: $owner, name: $name) {
              release(tagName: $tag) {
                databaseId
                tagName
                isDraft
                isPrerelease
                url
              }
            }
          }
          '@
          $identityJson = gh api graphql `
            -f query=$query `
            -F owner=$($Matches.owner) `
            -F name=$($Matches.name) `
            -F tag=$env:AMD_RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release preflight lookup failed.' }
          $response = ($identityJson -join "`n") | ConvertFrom-Json
          if ($null -ne $response.errors -or $null -eq $response.data.repository) {
            throw 'GitHub release preflight response could not prove the repository identity.'
          }
          $identity = $response.data.repository.release
          if ($null -ne $identity) {
            throw 'A release or draft already exists for this tag; assets are immutable in this workflow.'
          }

      - name: Set up exact build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Create the repository virtual environment
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3, 11, 9), sys.version"
          python -m venv .venv
          .\.venv\Scripts\python.exe -c "import sys; assert sys.version_info[:3] == (3, 11, 9), sys.version"

      - name: Run tests, build, package, and extracted-EXE verification
        id: assets
        shell: pwsh
        env:
          AMD_RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          .\scripts\package_release.ps1 -Version $env:AMD_RELEASE_VERSION

      - name: Upload MIT-approved public repository release handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ steps.assets.outputs.zip_path }}
            ${{ steps.assets.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          archive: true

  verify-handoff:
    name: Verify downloaded handoff
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact verifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.source-commit }}
          persist-credentials: false

      - name: Set up exact verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"

      - name: Install the locked verifier environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes -r .\requirements-lock.txt

      - name: Download the release handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: artifacts/release
          skip-decompress: false
          digest-mismatch: error

      - name: Verify exact assets, checksum, safe paths, and packaged EXE
        shell: pwsh
        env:
          AMD_RELEASE_VERSION: ${{ needs.package.outputs.version }}
          AMD_EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          .\scripts\package_release.ps1 `
            -Version $env:AMD_RELEASE_VERSION `
            -OutputDirectory artifacts\release `
            -VerifyOnly
          $actual = (Get-FileHash -LiteralPath "artifacts\release\${{ needs.package.outputs.zip-name }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:AMD_EXPECTED_SHA256) {
            throw 'Downloaded artifact SHA-256 differs from the package job output.'
          }

  release:
    name: Safely stage or publish prerelease
    if: needs.package.outputs.release-mode != 'build-only'
    needs: [package, verify-handoff]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.source-commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"

      - name: Install the locked verifier environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes -r .\requirements-lock.txt

      - name: Download the independently verified handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: artifacts/release
          skip-decompress: false
          digest-mismatch: error

      - name: Reverify the exact assets before GitHub mutation
        shell: pwsh
        env:
          AMD_RELEASE_VERSION: ${{ needs.package.outputs.version }}
          AMD_EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          .\scripts\package_release.ps1 `
            -Version $env:AMD_RELEASE_VERSION `
            -OutputDirectory artifacts\release `
            -VerifyOnly
          $actual = (Get-FileHash -LiteralPath "artifacts\release\${{ needs.package.outputs.zip-name }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:AMD_EXPECTED_SHA256) {
            throw 'Release-job artifact SHA-256 differs from the verified package output.'
          }

      - name: Create notes, verify the exact draft, and optionally publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AMD_REPOSITORY: ${{ github.repository }}
          AMD_RELEASE_VERSION: ${{ needs.package.outputs.version }}
          AMD_RELEASE_TAG: ${{ needs.package.outputs.tag }}
          AMD_RELEASE_MODE: ${{ needs.package.outputs.release-mode }}
          AMD_SOURCE_COMMIT: ${{ needs.package.outputs.source-commit }}
          AMD_EXPECTED_TAG_OBJECT: ${{ needs.package.outputs.tag-object }}
          AMD_ZIP_NAME: ${{ needs.package.outputs.zip-name }}
          AMD_CHECKSUM_NAME: ${{ needs.package.outputs.checksum-name }}
          AMD_ZIP_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = Join-Path 'artifacts\release' $env:AMD_ZIP_NAME
          $checksumPath = Join-Path 'artifacts\release' $env:AMD_CHECKSUM_NAME
          $publicNames = @($env:AMD_ZIP_NAME, $env:AMD_CHECKSUM_NAME) | Sort-Object
          $publicPaths = @($zipPath, $checksumPath)

          function Assert-ReleaseSourceUnchanged {
            git fetch --force --no-tags origin "+refs/tags/$($env:AMD_RELEASE_TAG)`:refs/tags/$($env:AMD_RELEASE_TAG)"
            if ($LASTEXITCODE -ne 0) { throw 'Release tag refresh failed.' }
            git fetch --no-tags origin main
            if ($LASTEXITCODE -ne 0) { throw 'origin/main refresh failed.' }
            $tagType = (git cat-file -t "refs/tags/$($env:AMD_RELEASE_TAG)").Trim()
            $tagObject = (git rev-parse "refs/tags/$($env:AMD_RELEASE_TAG)").Trim()
            $tagCommit = (git rev-parse "refs/tags/$($env:AMD_RELEASE_TAG)^{}").Trim()
            $mainCommit = (git rev-parse origin/main).Trim()
            if ($tagType -ne 'tag' -or $tagObject -ne $env:AMD_EXPECTED_TAG_OBJECT -or
                $tagCommit -ne $env:AMD_SOURCE_COMMIT -or $mainCommit -ne $env:AMD_SOURCE_COMMIT) {
              throw 'Annotated release tag, packaged source, and origin/main changed or no longer identify the same commit; release mutation is forbidden.'
            }
          }

          function Get-ReleaseIdentityByTag {
            if ($env:AMD_REPOSITORY -notmatch '^(?<owner>[^/]+)/(?<name>[^/]+)$') {
              throw 'GitHub repository identity is invalid.'
            }
            $query = @'
          query($owner: String!, $name: String!, $tag: String!) {
            repository(owner: $owner, name: $name) {
              release(tagName: $tag) {
                databaseId
                tagName
                isDraft
                isPrerelease
                url
              }
            }
          }
          '@
            $identityJson = gh api graphql `
              -f query=$query `
              -F owner=$($Matches.owner) `
              -F name=$($Matches.name) `
              -F tag=$env:AMD_RELEASE_TAG
            if ($LASTEXITCODE -ne 0) { throw 'GitHub exact-tag release lookup failed.' }
            $response = ($identityJson -join "`n") | ConvertFrom-Json
            if ($null -ne $response.errors -or $null -eq $response.data.repository) {
              throw 'GitHub exact-tag response could not prove the repository identity.'
            }
            return $response.data.repository.release
          }

          function Test-ExactRemoteAssets {
            param([Parameter(Mandatory = $true)][object]$Release)

            $remoteNames = @($Release.assets | ForEach-Object { [string]$_.name } | Sort-Object)
            if (($remoteNames -join '|') -ne ($publicNames -join '|')) { return $false }
            foreach ($path in $publicPaths) {
              $name = Split-Path -Leaf $path
              $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              $length = (Get-Item -LiteralPath $path).Length
              $asset = @($Release.assets | Where-Object { $_.name -eq $name })
              if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or
                  [long]$asset[0].size -ne $length -or [string]$asset[0].digest -ne "sha256:$hash") {
                return $false
              }
            }
            return $true
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "ArubaMiniDashboard-$($env:AMD_RELEASE_VERSION)-release-notes.md"
          $notesText = @"
          # Aruba Mini Dashboard $($env:AMD_RELEASE_TAG)

          Windows 11용 Aruba Mobility Master 및 7240XM 상태 미니 대시보드의 사전 릴리스입니다.

          ## 라이선스

          Aruba Mini Dashboard 자체 소스와 배포물은 **MIT License**로 제공됩니다.
          함께 배포되는 제3자 구성요소는 각 구성요소의 라이선스를 따르며, 정확한 고지와
          원문은 ZIP의 ``THIRD_PARTY_NOTICES.txt`` 및 ``QT_THIRD_PARTY_NOTICES.txt``에서 확인할 수 있습니다.
          앱 라이선스: https://github.com/$($env:AMD_REPOSITORY)/blob/$($env:AMD_SOURCE_COMMIT)/LICENSE

          ## 배포 파일

          - ``$($env:AMD_ZIP_NAME)``: Python 설치 없이 실행하는 Windows x64 onedir 패키지
          - ``$($env:AMD_CHECKSUM_NAME)``: ZIP SHA-256 확인 파일
          - ZIP SHA-256: ``$($env:AMD_ZIP_SHA256)``
          - ZIP 내부 ``THIRD_PARTY_NOTICES.txt`` 및 ``QT_THIRD_PARTY_NOTICES.txt``:
            함께 배포되는 런타임의 고지와 라이선스 원문
          - ``QT_RUNTIME_INVENTORY.json`` 및 ``LGPL_RUNTIME_INVENTORY.json``:
            실제 Qt DLL/plugin과 외부 PySide6/shiboken6/Paramiko/scp 소스의 경로·해시 검증 기록

          GitHub가 자동으로 표시하는 **Source code (zip)** 및 **Source code (tar.gz)**는
          소스 아카이브이며 일반 사용자가 실행하는 Windows 배포 파일이 아닙니다.

          ## 검증 기준

          - 소스 커밋: ``$($env:AMD_SOURCE_COMMIT)``
          - Python: ``3.11.9``
          - 테스트, 제3자 고지 정합성, PyInstaller 빌드, PE 버전 리소스, Qt exact inventory,
            LGPL Python 소스의 외부 제공·PYZ 비포함, 원본 onedir 검증, ZIP 안전 경로와
            민감 파일 검사, 압축 해제 후 EXE 스모크 검증 통과
          - 상세 변경 이력: https://github.com/$($env:AMD_REPOSITORY)/blob/$($env:AMD_SOURCE_COMMIT)/CHANGELOG.md

          ## 현장 확인 범위

          실제 Aruba 장비 출력과 사내 SSH 환경, 코드 서명, Python 미설치 클린 Windows 11,
          실제 100%/125%/150% DPI 및 조직 정책이 적용된 알림 검증은 별도 현장 확인이 필요합니다.
          실제 장비 설정을 변경하는 명령은 지원하지 않지만, 운영망 적용 전 읽기 전용 계정과
          호스트 키 정책을 현장 기준으로 다시 확인하십시오.
          "@
          $notesText = $notesText -replace '(?m)^          ', ''
          [System.IO.File]::WriteAllText($notesPath, $notesText, (New-Object System.Text.UTF8Encoding($false)))

          $draftCreated = $false
          $publishAttempted = $false
          $releasePublished = $false
          $releaseId = $null
          $releaseUrl = $null
          try {
            Assert-ReleaseSourceUnchanged
            $existing = Get-ReleaseIdentityByTag
            if ($null -ne $existing) {
              throw 'A release or draft already exists for this tag; no existing asset will be replaced.'
            }

            $createOutput = @(gh release create $env:AMD_RELEASE_TAG `
              --repo $env:AMD_REPOSITORY `
              --verify-tag `
              --target $env:AMD_SOURCE_COMMIT `
              --title "Aruba Mini Dashboard $($env:AMD_RELEASE_TAG)" `
              --notes-file $notesPath `
              --draft `
              --prerelease)
            if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease draft creation failed.' }
            $outputLines = @($createOutput | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ })
            if ($outputLines.Count -eq 0) { throw 'GitHub did not return the created draft URL.' }
            $releaseUrl = $outputLines[-1]
            $draftCreated = $true

            $draftIdentity = $null
            foreach ($attempt in 1..8) {
              $candidate = Get-ReleaseIdentityByTag
              if ($null -ne $candidate) {
                if ([long]$candidate.databaseId -le 0 -or
                    $candidate.tagName -ne $env:AMD_RELEASE_TAG -or
                    -not $candidate.isDraft -or -not $candidate.isPrerelease -or
                    [string]$candidate.url -ne $releaseUrl) {
                  throw 'The exact-tag release is not the prerelease draft created by this run.'
                }
                $draftIdentity = $candidate
                break
              }
              if ($attempt -lt 8) { Start-Sleep -Seconds 2 }
            }
            if ($null -eq $draftIdentity) { throw 'The created prerelease draft could not be identified safely.' }
            $releaseId = [long]$draftIdentity.databaseId

            $draftJson = gh api "repos/$($env:AMD_REPOSITORY)/releases/$releaseId"
            if ($LASTEXITCODE -ne 0) { throw 'Prerelease draft lookup by exact numeric ID failed.' }
            $draft = ($draftJson -join "`n") | ConvertFrom-Json
            if ([long]$draft.id -ne $releaseId -or $draft.tag_name -ne $env:AMD_RELEASE_TAG -or
                [string]$draft.html_url -ne $releaseUrl -or
                -not $draft.draft -or -not $draft.prerelease) {
              throw 'The numeric release ID does not identify the exact prerelease draft created by this run.'
            }
            if (@($draft.assets).Count -ne 0) { throw 'The new prerelease draft unexpectedly contains assets.' }

            foreach ($path in $publicPaths) {
              gh release upload $env:AMD_RELEASE_TAG $path --repo $env:AMD_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed: $path" }
            }

            $assetsVerified = $false
            foreach ($attempt in 1..8) {
              $draftJson = gh api "repos/$($env:AMD_REPOSITORY)/releases/$releaseId"
              if ($LASTEXITCODE -ne 0) { throw 'Prerelease draft lookup by ID failed.' }
              $draft = ($draftJson -join "`n") | ConvertFrom-Json
              if ([long]$draft.id -ne $releaseId -or $draft.tag_name -ne $env:AMD_RELEASE_TAG -or
                  [string]$draft.html_url -ne $releaseUrl -or
                  -not $draft.draft -or -not $draft.prerelease) {
                throw 'Prerelease draft identity changed after asset upload.'
              }
              $assetsVerified = Test-ExactRemoteAssets -Release $draft
              if ($assetsVerified) { break }
              if ($attempt -lt 8) { Start-Sleep -Seconds 3 }
            }
            if (-not $assetsVerified) { throw 'Uploaded asset names, sizes, or SHA-256 digests do not match local files.' }

            Assert-ReleaseSourceUnchanged
            if ($env:AMD_RELEASE_MODE -eq 'draft-prerelease') {
              Write-Host "Verified prerelease draft created: $releaseUrl"
            }
            elseif ($env:AMD_RELEASE_MODE -eq 'publish-prerelease') {
              Assert-ReleaseSourceUnchanged
              $publishAttempted = $true
              $publishJson = gh api --method PATCH "repos/$($env:AMD_REPOSITORY)/releases/$releaseId" `
                -F draft=false `
                -F prerelease=true
              if ($LASTEXITCODE -ne 0) { throw 'Publishing the verified prerelease draft failed.' }
              $published = ($publishJson -join "`n") | ConvertFrom-Json
              if ([long]$published.id -eq $releaseId -and -not $published.draft) {
                $releasePublished = $true
              }
              if ([long]$published.id -ne $releaseId -or $published.tag_name -ne $env:AMD_RELEASE_TAG -or
                  $published.draft -or -not $published.prerelease -or -not $published.published_at) {
                throw 'GitHub did not return the exact published prerelease expected by this run.'
              }
              $publishedUrl = [string]$published.html_url
              if ([string]::IsNullOrWhiteSpace($publishedUrl)) {
                throw 'GitHub did not return the published prerelease URL.'
              }

              $publishedVerified = $false
              foreach ($attempt in 1..8) {
                $publishedJson = gh api "repos/$($env:AMD_REPOSITORY)/releases/$releaseId"
                if ($LASTEXITCODE -ne 0) { throw 'Published prerelease lookup by ID failed.' }
                $published = ($publishedJson -join "`n") | ConvertFrom-Json
                if ([long]$published.id -eq $releaseId -and -not $published.draft) {
                  $releasePublished = $true
                }
                if ([long]$published.id -ne $releaseId -or $published.tag_name -ne $env:AMD_RELEASE_TAG -or
                    $published.draft -or -not $published.prerelease -or -not $published.published_at) {
                  throw 'Published prerelease identity changed during final verification.'
                }
                $publishedUrl = [string]$published.html_url
                if ([string]::IsNullOrWhiteSpace($publishedUrl)) {
                  throw 'Published prerelease URL is missing during final verification.'
                }
                $publishedVerified = Test-ExactRemoteAssets -Release $published
                if ($publishedVerified) { break }
                if ($attempt -lt 8) { Start-Sleep -Seconds 3 }
              }
              if (-not $publishedVerified) {
                throw 'Published prerelease assets no longer match the exact verified ZIP and checksum files.'
              }
              Assert-ReleaseSourceUnchanged
              Write-Host "Verified public prerelease published: $publishedUrl"
            }
            else {
              throw "Unexpected release mode: $($env:AMD_RELEASE_MODE)"
            }
          }
          catch {
            $failure = $_
            if ($releasePublished) {
              Write-Warning 'The prerelease was published before final verification failed. It was not deleted or modified automatically; inspect the exact release ID immediately.'
            }
            elseif ($publishAttempted) {
              Write-Warning 'Publishing was attempted, so automatic draft cleanup is forbidden even when the API result is ambiguous. Inspect the exact release ID immediately.'
            }
            elseif ($draftCreated -and $null -ne $releaseId) {
              $cleanupCompleted = $false
              $nonDraftObserved = $false
              $cleanupJson = gh api "repos/$($env:AMD_REPOSITORY)/releases/$releaseId" 2>$null
              if ($LASTEXITCODE -eq 0 -and $cleanupJson) {
                try {
                  $cleanup = ($cleanupJson -join "`n") | ConvertFrom-Json
                  $cleanupIdMatches = [long]$cleanup.id -eq $releaseId
                  if ($cleanupIdMatches -and -not $cleanup.draft) {
                    $releasePublished = $true
                    $nonDraftObserved = $true
                    Write-Warning 'The exact release is no longer a draft. It was not deleted or modified automatically; inspect it immediately.'
                  }
                  else {
                    $cleanupDraftIdentityMatches = (
                      $cleanupIdMatches -and
                      $cleanup.tag_name -eq $env:AMD_RELEASE_TAG -and
                      [string]$cleanup.html_url -eq $releaseUrl -and
                      $cleanup.draft -and
                      $cleanup.prerelease
                    )
                    if ($cleanupDraftIdentityMatches) {
                      gh api --method DELETE "repos/$($env:AMD_REPOSITORY)/releases/$releaseId" *> $null
                      if ($LASTEXITCODE -eq 0) {
                        $cleanupCompleted = $true
                        Write-Warning 'Removed the exact unpublished prerelease draft after a verification failure; the pre-existing tag was preserved.'
                      }
                    }
                  }
                }
                catch {
                  Write-Warning 'Could not prove the draft cleanup target; automatic deletion was skipped.'
                }
              }
              if (-not $cleanupCompleted -and -not $nonDraftObserved) {
                Write-Warning 'The unpublished draft may remain; inspect its exact numeric release ID before retrying.'
              }
            }
            elseif ($draftCreated) {
              Write-Warning 'A draft may remain because its exact numeric release ID could not be confirmed; inspect GitHub before retrying.'
            }
            $global:LASTEXITCODE = 0
            throw $failure
          }
