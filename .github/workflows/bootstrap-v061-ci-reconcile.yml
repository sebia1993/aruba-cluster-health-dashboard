name: "Bootstrap v0.6.1 CI behavior reconciliation"

on:
  push:
    branches:
      - agent/v0.6.1-connection-baseline-acceptance
    paths:
      - scripts/apply_v061_ci_reconcile.py

permissions:
  contents: write

concurrency:
  group: aruba-mini-dashboard-v061-ci-reconcile
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/v0.6.1-connection-baseline-acceptance
          fetch-depth: 0
          persist-credentials: true
      - name: Apply CI reconciliation patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/apply_v061_ci_reconcile.py ]]; then
            exit 0
          fi
          python scripts/apply_v061_ci_reconcile.py
          python -m compileall -q src tests scripts
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test: align baseline lifecycle with operator acceptance"
          git push origin HEAD:agent/v0.6.1-connection-baseline-acceptance
